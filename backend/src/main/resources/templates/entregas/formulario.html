<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrega | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow">Logística</p><h1>Programar entrega.</h1><form class="form-panel light-panel" th:action="@{/entregas}" th:object="${entrega}" method="post"><input type="hidden" th:field="*{id}"><label>Pedido<select th:field="*{pedido}"><option value="">Selecciona un pedido</option><option th:each="pedido : ${pedidos}" th:value="${pedido.id}" th:text="|Pedido #${pedido.id} · ${pedido.cliente.nombre}|"></option></select><small th:errors="*{pedido}"></small></label><label>Conductor<input type="text" th:field="*{conductor}"><small th:errors="*{conductor}"></small></label><label>Dirección<input type="text" th:field="*{direccion}"><small th:errors="*{direccion}"></small></label><div class="form-grid"><label>Fecha<input type="date" th:field="*{fechaProgramada}"><small th:errors="*{fechaProgramada}"></small></label><label>Estado<select th:field="*{estado}"><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}"></option></select></label></div><label>Observaciones<textarea th:field="*{observaciones}" rows="3"></textarea></label><button type="submit">Guardar entrega <span>→</span></button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
