<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Factura | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><div class="notice error" th:if="${mensaje}" th:text="${mensaje}"></div><p class="eyebrow">Factura</p><h1 th:text="${factura.numeroFactura}"></h1><p class="lead" th:text="|Pedido #${factura.pedido.id} · ${factura.pedido.cliente.nombre}|"></p><section class="detail-grid"><div><span>Subtotal</span><strong th:text="|$ ${#numbers.formatDecimal(factura.subtotal, 1, 2)}|"></strong></div><div><span>Adicionales</span><strong th:text="|$ ${#numbers.formatDecimal(factura.costosAdicionales, 1, 2)}|"></strong></div><div><span>Total</span><strong th:text="|$ ${#numbers.formatDecimal(factura.total, 1, 2)}|"></strong></div><div><span>Estado</span><strong th:text="${factura.estado}"></strong></div></section><section class="catalog-panel"><h2>Pagos administrativos</h2><div class="empty-state" th:if="${factura.pagos.empty}">No hay pagos registrados.</div><div class="flower-list" th:unless="${factura.pagos.empty}"><article class="flower-row" th:each="pago : ${factura.pagos}"><div class="flower-icon">✓</div><div class="flower-data"><h3 th:text="${pago.metodoPago}"></h3><p th:text="${#temporals.format(pago.fecha, 'dd/MM/yyyy')}"></p></div><strong th:text="|$ ${#numbers.formatDecimal(pago.valor, 1, 2)}|"></strong><span class="stock" th:text="${pago.estado}"></span></article></div></section><form class="form-panel" th:object="${pago}" th:action="@{/facturas/{id}/pagos(id=${factura.id})}" method="post"><h2>Registrar pago simulado</h2><div class="form-grid"><label>Valor<input type="number" min="0.01" step="0.01" th:field="*{valor}"><small th:errors="*{valor}"></small></label><label>Fecha<input type="date" th:field="*{fecha}"><small th:errors="*{fecha}"></small></label></div><label>Método de pago<input type="text" th:field="*{metodoPago}"><small th:errors="*{metodoPago}"></small></label><button type="submit">Registrar pago <span>→</span></button></form><div class="actions"><a class="text-link" th:href="@{/facturas}">Volver</a></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
