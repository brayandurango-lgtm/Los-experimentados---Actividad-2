<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Clientes | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell"><div class="page-title"><div><p class="eyebrow">Clientes</p><h1>Agenda de clientes</h1></div><a class="button" th:href="@{/clientes/nuevo}">+ Nuevo cliente</a></div><div class="notice" th:if="${mensaje}" th:text="${mensaje}"></div><section class="catalog-panel"><div class="empty-state" th:if="${clientes.empty}">Aún no hay clientes.</div><div class="flower-list" th:unless="${clientes.empty}"><article class="flower-row" th:each="cliente : ${clientes}"><div class="flower-icon">◎</div><div class="flower-data"><h3 th:text="${cliente.nombre}">Cliente</h3><p th:text="${cliente.email + ' · ' + cliente.telefono}">correo · teléfono</p></div><span class="stock" th:text="${cliente.direccion}">Dirección</span><div class="flower-actions"><a class="row-link" th:href="@{/clientes/{id}/editar(id=${cliente.id})}">Editar</a><form th:action="@{/clientes/{id}/eliminar(id=${cliente.id})}" method="post" onsubmit="return confirm('¿Deseas eliminar este cliente?');"><button class="row-link" type="submit">Eliminar</button></form></div></article></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
