<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Entregas | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell"><div class="page-title"><div><p class="eyebrow">Logística</p><h1>Entregas</h1></div><a class="button" th:href="@{/entregas/nueva}">+ Nueva entrega</a></div><div style="margin-bottom: 1.5rem; text-align: center;"><img th:src="@{/img/flores-de-pedidos.jpg}" alt="Flores preparadas para entrega" style="width: 100%; max-height: 460px; object-fit: contain; border-radius: 8px; background: #f6f2ef; display: block; margin: 0 auto;"></div><div class="notice" th:if="${mensaje}" th:text="${mensaje}"></div><section class="catalog-panel"><div class="section-heading"><h2>Ruta de entregas</h2><span class="count" th:text="${entregas.size()} + ' entregas'"></span></div><div class="empty-state" th:if="${entregas.empty}">Aún no hay entregas programadas.</div><div class="flower-list" th:unless="${entregas.empty}"><article class="flower-row" th:each="entrega : ${entregas}"><div class="flower-icon">↗</div><div class="flower-data"><h3 th:text="|Pedido #${entrega.pedido.id} · ${entrega.pedido.cliente.nombre}|">Pedido</h3><p th:text="${entrega.direccion + ' · Conductor: ' + entrega.conductor}">Dirección</p></div><strong th:text="${#temporals.format(entrega.fechaProgramada, 'dd/MM/yyyy')}">30/08/2026</strong><span class="stock" th:text="${entrega.estado}">PROGRAMADA</span><div class="flower-actions"><a class="row-link" th:href="@{/entregas/{id}(id=${entrega.id})}">Ver</a><a class="row-link" th:href="@{/entregas/{id}/editar(id=${entrega.id})}">Editar</a><form th:action="@{/entregas/{id}/eliminar(id=${entrega.id})}" method="post" onsubmit="return confirm('¿Está seguro de eliminar este registro?');"><button class="row-link" type="submit">Eliminar</button></form></div></article></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
