<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cliente | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow">Clientes</p><h1>Crear cliente</h1><form class="form-panel light-panel" th:action="@{/clientes}" th:object="${cliente}" method="post"><label>Nombre<input type="text" th:field="*{nombre}"><small th:errors="*{nombre}"></small></label><label>Correo<input type="email" th:field="*{email}"><small th:errors="*{email}"></small></label><label>Teléfono<input type="text" th:field="*{telefono}"><small th:errors="*{telefono}"></small></label><label>Dirección<input type="text" th:field="*{direccion}"><small th:errors="*{direccion}"></small></label><button type="submit">Guardar cliente <span>→</span></button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
