<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reportes | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell"><p class="eyebrow">Lectura del negocio</p><h1>Reportes.</h1><section class="stats"><div class="stat-card"><span>Ventas pagadas</span><strong th:text="|$ ${#numbers.formatDecimal(totalVentas, 1, 2)}|">$ 0.00</strong></div><div class="stat-card"><span>Pedidos</span><strong th:text="${cantidadPedidos}">0</strong></div></section><div class="report-columns"><section class="catalog-panel"><h2>Pedidos por estado</h2><div class="report-line" th:each="item : ${pedidosPorEstado}"><span th:text="${item.key}">EN_CURSO</span><strong th:text="${item.value}">0</strong></div></section><section class="catalog-panel"><h2>Entregas por estado</h2><div class="report-line" th:each="item : ${entregasPorEstado}"><span th:text="${item.key}">PROGRAMADA</span><strong th:text="${item.value}">0</strong></div></section><section class="catalog-panel"><h2>Flores más vendidas</h2><div class="report-line" th:each="item : ${floresMasVendidas}"><span th:text="${item[0]}">Rosa</span><strong th:text="${item[1]}">0</strong></div><p class="empty-state" th:if="${floresMasVendidas.empty}">Aún no hay ventas detalladas.</p></section><section class="catalog-panel"><h2>Clientes con más pedidos</h2><div class="report-line" th:each="item : ${clientesConMasPedidos}"><span th:text="${item[0]}">Cliente</span><strong th:text="${item[1]}">0</strong></div><p class="empty-state" th:if="${clientesConMasPedidos.empty}">Aún no hay pedidos.</p></section></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
