<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de flor | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow">Detalle de inventario</p><h1 th:text="${flor.tipo}"></h1><p class="lead" th:text="${flor.color + ' · ' + flor.variedad}"></p><section class="detail-grid"><div><span>Disponibles</span><strong th:text="${flor.cantidadDisponible}"></strong></div><div><span>Precio compra</span><strong th:text="|$ ${#numbers.formatDecimal(flor.precioCompra, 1, 2)}|"></strong></div><div><span>Precio venta</span><strong th:text="|$ ${#numbers.formatDecimal(flor.precioVenta, 1, 2)}|"></strong></div><div><span>Estado</span><strong th:text="${flor.estado}"></strong></div></section><p class="meta" th:if="${flor.fechaCreacion}" th:text="|Creada: ${#temporals.format(flor.fechaCreacion, 'dd/MM/yyyy HH:mm')} · Actualizada: ${#temporals.format(flor.fechaActualizacion, 'dd/MM/yyyy HH:mm')}|"></p><div class="actions"><a class="button" th:href="@{/flores/{id}/editar(id=${flor.id})}">Editar</a><form th:action="@{/flores/eliminar/{id}(id=${flor.id})}" method="post" onsubmit="return confirm('¿Deseas eliminar esta flor del catálogo?');"><button class="button secondary" type="submit">Eliminar</button></form><a class="text-link" th:href="@{/flores}">Volver</a></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
