<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Detalle de entrega | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow" th:text="|Entrega #${entrega.id}|"></p><h1 th:text="|Pedido #${entrega.pedido.id}|"></h1><p class="lead" th:text="${entrega.direccion}"></p><section class="detail-grid"><div><span>Conductor</span><strong th:text="${entrega.conductor}"></strong></div><div><span>Fecha</span><strong th:text="${#temporals.format(entrega.fechaProgramada, 'dd/MM/yyyy')}"></strong></div><div><span>Cliente</span><strong th:text="${entrega.pedido.cliente.nombre}"></strong></div><div><span>Estado</span><strong th:text="${entrega.estado}"></strong></div></section><p class="detail-copy" th:if="${entrega.observaciones}" th:text="${entrega.observaciones}"></p><form class="status-form" th:action="@{/entregas/{id}/estado(id=${entrega.id})}" method="post"><label>Estado<select name="estado"><option th:each="estado : ${estados}" th:value="${estado}" th:text="${estado}" th:selected="${estado == entrega.estado}"></option></select></label><button class="button" type="submit">Cambiar estado</button></form><div class="actions"><a class="button" th:href="@{/entregas/{id}/editar(id=${entrega.id})}">Editar</a><form th:action="@{/entregas/{id}/eliminar(id=${entrega.id})}" method="post" onsubmit="return confirm('¿Deseas eliminar esta entrega?');"><button class="button secondary" type="submit">Eliminar</button></form><a class="text-link" th:href="@{/entregas}">Volver</a></div></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
