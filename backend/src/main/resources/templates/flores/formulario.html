<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Flor | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow" th:text="${flor.id == null ? 'Nueva entrada' : 'Editar inventario'}"></p><h1 th:text="${flor.id == null ? 'Registrar una flor' : 'Actualizar una flor'}"></h1><form class="form-panel light-panel" th:action="@{/flores}" th:object="${flor}" method="post"><input type="hidden" th:field="*{id}"><label>Tipo<input type="text" th:field="*{tipo}" required><small th:errors="*{tipo}"></small></label><label>Color<input type="text" th:field="*{color}" required><small th:errors="*{color}"></small></label><label>Variedad<input type="text" th:field="*{variedad}" required><small th:errors="*{variedad}"></small></label><div class="form-grid"><label>Cantidad<input type="number" min="0" step="1" th:field="*{cantidadDisponible}" required><small th:errors="*{cantidadDisponible}"></small></label><label>Estado<select th:field="*{estado}" required><option value="ACTIVA">Activa</option><option value="INACTIVA">Inactiva</option></select><small th:errors="*{estado}"></small></label></div><div class="form-grid"><label>Precio compra<input type="number" min="0.01" step="0.01" th:field="*{precioCompra}" required><small th:errors="*{precioCompra}"></small></label><label>Precio venta<input type="number" min="0.01" step="0.01" th:field="*{precioVenta}" required><small th:errors="*{precioVenta}"></small></label></div><button type="submit">Guardar flor <span>→</span></button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
