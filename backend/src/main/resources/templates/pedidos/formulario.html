<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pedido | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow" th:text="${pedido.id == null ? 'Nuevo pedido' : 'Editar pedido'}"></p><h1>Organiza un encargo.</h1><form class="form-panel light-panel" th:action="@{/pedidos}" th:object="${pedido}" method="post"><input type="hidden" th:field="*{id}"><label>Cliente<select th:field="*{cliente}"><option value="">Selecciona un cliente</option><option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nombre}"></option></select><small th:errors="*{cliente}"></small></label><div class="form-grid" th:if="${pedido.id == null}"><label>Flor<select th:field="*{florId}"><option value="">Selecciona una flor</option><option th:each="flor : ${flores}" th:if="${flor.estado == 'ACTIVA' and flor.cantidadDisponible > 0}" th:value="${flor.id}" th:text="|${flor.tipo} · ${flor.color} · ${flor.cantidadDisponible} disponibles|"></option></select><small th:errors="*{florId}"></small></label><label>Cantidad<input type="number" min="1" th:field="*{cantidadFlor}"><small th:errors="*{cantidadFlor}"></small></label></div><label>Dirección<input type="text" th:field="*{direccionEntrega}"><small th:errors="*{direccionEntrega}"></small></label><label>Contacto<input type="text" th:field="*{contacto}"><small th:errors="*{contacto}"></small></label><div class="form-grid"><label>Tipo de arreglo<input type="text" th:field="*{tipoArreglo}"><small th:errors="*{tipoArreglo}"></small></label><label>Ocasión<input type="text" th:field="*{ocasion}"><small th:errors="*{ocasion}"></small></label></div><div class="form-grid"><label>Fecha de entrega<input type="date" th:field="*{fechaEntrega}"><small th:errors="*{fechaEntrega}"></small></label><label>Presupuesto<input type="number" min="0.01" step="0.01" th:field="*{presupuesto}"><small th:errors="*{presupuesto}"></small></label></div><button type="submit">Guardar pedido <span>→</span></button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
