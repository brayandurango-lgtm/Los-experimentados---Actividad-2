<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Factura | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell narrow"><p class="eyebrow">Administración</p><h1>Registrar factura.</h1><form class="form-panel light-panel" th:action="@{/facturas/guardar}" th:object="${factura}" method="post"><input type="hidden" th:field="*{id}"><label>Número<input type="text" th:field="*{numeroFactura}" required><small th:errors="*{numeroFactura}"></small></label><label>Pedido<select th:field="*{pedido}" required><option value="">Selecciona un pedido</option><option th:each="pedido : ${pedidos}" th:value="${pedido.id}" th:text="|Pedido #${pedido.id} · ${pedido.cliente.nombre}|"></option></select><small th:errors="*{pedido}"></small></label><div class="form-grid"><label>Subtotal<input type="number" min="0" step="0.01" th:field="*{subtotal}" required><small th:errors="*{subtotal}"></small></label><label>Costos adicionales<input type="number" min="0" step="0.01" th:field="*{costosAdicionales}" required><small th:errors="*{costosAdicionales}"></small></label></div><label>Fecha<input type="date" th:field="*{fecha}" required><small th:errors="*{fecha}"></small></label><button type="submit">Guardar factura <span>→</span></button></form></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
