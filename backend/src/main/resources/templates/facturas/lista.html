<!DOCTYPE html><html lang="es" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Facturas | Flores del Valle</title><link rel="stylesheet" th:href="@{/css/estilos.css}"></head><body><div th:replace="~{fragments/header :: header}"></div><main class="page-shell"><div class="page-title"><div><p class="eyebrow">Administración</p><h1>Facturación</h1></div><a class="button" th:href="@{/facturas/nueva}">+ Nueva factura</a></div><div class="notice" th:if="${mensaje}" th:text="${mensaje}"></div><section class="catalog-panel"><div class="empty-state" th:if="${facturas.empty}">No hay facturas registradas.</div><div class="flower-list" th:unless="${facturas.empty}"><article class="flower-row" th:each="factura : ${facturas}"><div class="flower-icon">$</div><div class="flower-data"><h3 th:text="${factura.numeroFactura}">FAC-001</h3><p th:text="|Pedido #${factura.pedido.id} · ${factura.pedido.cliente.nombre}|">Pedido</p></div><strong th:text="|$ ${#numbers.formatDecimal(factura.total, 1, 2)}|">$ 80.00</strong><span class="stock" th:text="${factura.estado}">PENDIENTE</span><a class="row-link" th:href="@{/facturas/{id}(id=${factura.id})}">Ver</a></article></div></section></main><div th:replace="~{fragments/footer :: footer}"></div></body></html>
